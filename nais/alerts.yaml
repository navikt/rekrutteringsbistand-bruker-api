apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rekrutteringsbistand-bruker-api
  namespace: toi
  labels:
    team: toi
spec:
  groups:
    - name: rekrutteringsbistand-bruker-api
      rules:
        - alert: rekrutteringsbistand-bruker-api
          expr: kube_deployment_status_replicas_available{deployment="rekrutteringsbistand-bruker-api"} == 0
          for: 1s
          annotations:
            summary: Appen er nede
            action: "https://logs.az.nav.no/goto/837a1fc426ad1d937272a0488f9b700e?security_tenant=navlogs"
          labels:
            namespace: toi
            severity: critical

        - alert: rekrutteringsbistand-bruker-api
          expr: sum(increase(log_messages_errors{app="rekrutteringsbistand-bruker-api", level="Error"}[10m])) > 0
          for: 1s
          annotations:
            summary: Appen har logget en error
            action: "https://logs.az.nav.no/goto/837a1fc426ad1d937272a0488f9b700e?security_tenant=navlogs"
          labels:
            namespace: toi
            severity: critical

        - alert: rekrutteringsbistand-bruker-api
          expr: sum(increase(log_messages_errors{app="rekrutteringsbistand-bruker-api", level="Warning"}[10m])) > 3
          for: 1s
          annotations:
            summary: Økning i warnings
            action: "https://logs.az.nav.no/goto/837a1fc426ad1d937272a0488f9b700e?security_tenant=navlogs"
          labels:
            namespace: toi
            severity: warning

        # Jobben kjører hver time. Måleren er 0 til første vellykkede kjøring etter oppstart, så etter
        # en deploy går alerten bare hvis de to første kjøringene feiler eller jobben ikke starter.
        - alert: rekrutteringsbistand-bruker-api-lagrede-sok-opprydning
          expr: time() - max(lagrede_sok_opprydning_sist_vellykket_sekunder{app="rekrutteringsbistand-bruker-api"}) > 6 * 60 * 60
          for: 2h
          annotations:
            summary: Opprydningen av lagrede søk har ikke kjørt uten feil på over seks timer
            action: "https://logs.az.nav.no/goto/837a1fc426ad1d937272a0488f9b700e?security_tenant=navlogs"
          labels:
            namespace: toi
            severity: warning
