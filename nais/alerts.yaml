apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rekrutteringsbistand-bruker-api
  namespace: toi
  labels:
    team: toi
spec:
  groups:
    - name: rekrutteringsbistand-bruker-api
      rules:
        - alert: rekrutteringsbistand-bruker-api
          expr: kube_deployment_status_replicas_available{deployment="rekrutteringsbistand-bruker-api"} == 0
          for: 1s
          annotations:
            summary: Appen er nede
            action: "https://logs.az.nav.no/goto/837a1fc426ad1d937272a0488f9b700e?security_tenant=navlogs"
          labels:
            namespace: toi
            severity: critical

        - alert: rekrutteringsbistand-bruker-api
          expr: sum(increase(log_messages_errors{app="rekrutteringsbistand-bruker-api", level="Error"}[10m])) > 0
          for: 1s
          annotations:
            summary: Appen har logget en error
            action: "https://logs.az.nav.no/goto/837a1fc426ad1d937272a0488f9b700e?security_tenant=navlogs"
          labels:
            namespace: toi
            severity: critical

        - alert: rekrutteringsbistand-bruker-api
          expr: sum(increase(log_messages_errors{app="rekrutteringsbistand-bruker-api", level="Warning"}[10m])) > 3
          for: 1s
          annotations:
            summary: Økning i warnings
            action: "https://logs.az.nav.no/goto/837a1fc426ad1d937272a0488f9b700e?security_tenant=navlogs"
          labels:
            namespace: toi
            severity: warning

        # Måleren er 0 til første kjøring etter oppstart, derfor venter vi 30 minutter før alerten går.
        - alert: rekrutteringsbistand-bruker-api-standardsok-opprydning
          expr: time() - max(standardsok_opprydning_sist_vellykket_sekunder{app="rekrutteringsbistand-bruker-api"}) > 2 * 24 * 60 * 60
          for: 30m
          annotations:
            summary: Opprydningen av lagrede søk har ikke kjørt uten feil på over to døgn
            action: "https://logs.az.nav.no/goto/837a1fc426ad1d937272a0488f9b700e?security_tenant=navlogs"
          labels:
            namespace: toi
            severity: warning
